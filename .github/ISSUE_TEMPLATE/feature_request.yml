name: Feature request
description: A research question the tools cannot answer yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tools that cache what the API returns, exceed TNA's guideline of one request a second and 3,000 a day, write to a site, or work around a bot check will not be merged. See "Out of scope, by decision" in [docs/DESIGN.md](https://github.com/ianderso/tna-discovery-mcp/blob/main/docs/DESIGN.md).
  - type: textarea
    id: problem
    attributes:
      label: The research problem
      description: What you were trying to find or read, and where the current tools stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: A new tool, a new parameter, a change to what a tool returns, or a series that deserves a parser like WO 97's.
